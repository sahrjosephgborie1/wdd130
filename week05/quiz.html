<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic HTML and CSS Quiz</title>
  <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
  <main>
    <h1>✅ Basic HTML and CSS Quiz</h1>
    <form action="quiz">
      <div class="quiz-item">
        <label for="q1">1. What does the acronym CSS stand for?
          <input type="text" name="q1" id="q1"></label>
      </div>
      <div class="quiz-item">
        <label for="q2">2. How are id and class attributes selected in CSS? <textarea name="q2" id="q2" rows="5" placeholder="type here"></textarea></label>
      </div>
      <div class="quiz-item">
        <label for="q3">3. Which of the following is a vaqlid CSS Comment?</label>
        <select name="q3" id="q3">
          <option value="choose" selected disabled>Choose one ...</option>
          <option value="a">A. &lt;!-- This is a comment --&gt;;</option>
          <option value="b">B. /* This is a comment */</option>
          <option value="c">c. // This is a comment </option>
        </select>
      </div>
      <div class="quiz-item">
        <!-- 4.What is the bottom margin given to this declaration? -->
        <label for="q4">4. What is the bottom margin given to this declaration? </label>
        <code class="code">margin: 10px 5px 15px;</code>
        <input type="number" name="q4" id="q4">
      </div>
      <div class="quiz-item">
        <button type="submit">Submit Quix</button>
      </div>
    </form>
  </main>
  <footer>
    <p>&copy;2026 | Basic HTML & CSS Quiz</p>
  </footer>
</body>

</html>
